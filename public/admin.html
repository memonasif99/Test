<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Store Admin</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: .9rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: start; vertical-align: top; }
    th { background: var(--green-soft); position: sticky; top: 0; }
    td input { width: 90px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--border); }
    .status.placed { background: #fff3cd; color: #7a5b00; }
    .status.confirmed { background: #dbeafe; color: #1e40af; }
    .status.out_for_delivery { background: #ede9fe; color: #5b21b6; }
    .status.delivered { background: #dcfce7; color: #166534; }
    .status.cancelled { background: #fee2e2; color: #991b1b; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .actions .btn { padding: 5px 10px; font-size: .82rem; }
    .muted { color: var(--muted); font-size: .8rem; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .stat b { display: block; font-size: 1.4rem; }
    .low { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand"><span class="brand-mark" aria-hidden="true">🧺</span><span>Doha Fresh Mart · Admin</span></a>
      <nav class="topbar-actions">
        <button type="button" class="link-btn" id="logout" hidden>Log out</button>
      </nav>
    </div>
  </header>

  <main class="container" id="admin"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/admin.js"></script>
</body>
</html>
